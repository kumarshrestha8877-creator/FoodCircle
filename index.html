<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2310b981'><circle cx='12' cy='12' r='10'/><path fill='%23ffffff' d='M12 6a6 6 0 100 12A6 6 0 0012 6zm-1 3h2v4h-2zm0 6h2v2h-2z'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FoodCircle — AI-Powered Smart Food Rescue & Redistribution Platform</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  </head>
  <body class="bg-slate-50 text-slate-800 antialiased font-sans">
    <div id="root"></div>

    <!-- Friendly Protocol Helper: Guides users who double-click index.html directly from Windows Explorer -->
    <script>
      if (window.location.protocol === 'file:') {
        window.addEventListener('DOMContentLoaded', function () {
          var root = document.getElementById('root');
          if (root) {
            root.innerHTML = `
              <div style="font-family: system-ui, -apple-system, sans-serif; display: flex; min-height: 100vh; align-items: center; justify-content: center; background: #0f172a; color: white; padding: 24px;">
                <div style="background: #1e293b; border: 1px solid #334155; border-radius: 24px; max-width: 580px; width: 100%; padding: 36px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.6); text-align: center;">
                  <div style="width: 64px; height: 64px; background: #10b981; border-radius: 18px; margin: 0 auto 16px; display: flex; align-items: center; justify-content: center; font-size: 32px;">🍲</div>
                  <h1 style="font-size: 24px; font-weight: 800; margin: 0 0 6px; color: #ffffff;">FoodCircle Platform</h1>
                  <p style="color: #10b981; font-size: 13px; font-weight: 600; margin: 0 0 16px;">AI-Powered Smart Food Rescue & Redistribution</p>
                  
                  <div style="display: inline-block; background: #fef3c7; color: #92400e; border: 1px solid #fde68a; border-radius: 999px; padding: 6px 16px; font-size: 12px; font-weight: 700; margin-bottom: 20px;">
                    ⚠️ Direct File Opening Detected (file:// protocol)
                  </div>
                  
                  <p style="font-size: 14px; color: #94a3b8; line-height: 1.6; margin: 0 0 24px;">
                    Modern React and Vite applications cannot load their JavaScript modules directly through <code>file:///</code> due to browser security restrictions. They must be viewed through a local web server.
                  </p>
                  
                  <div style="background: #0f172a; border-radius: 14px; padding: 18px; margin-bottom: 24px; text-align: left; font-size: 13px; border: 1px solid #334155;">
                    <div style="color: #38bdf8; font-weight: 700; margin-bottom: 10px;">👉 How to open FoodCircle:</div>
                    <ol style="margin: 0; padding-left: 20px; color: #e2e8f0; line-height: 1.9;">
                      <li>If your server is already active: <a href="http://localhost:5173" style="color: #34d399; font-weight: bold; text-decoration: underline;">Click Here to Open http://localhost:5173</a></li>
                      <li>Double-click the <strong>Run-FoodCircle.bat</strong> file in the project folder</li>
                      <li>Or run <code style="background: #1e293b; color: #38bdf8; padding: 2px 6px; border-radius: 6px;">npm run dev</code> in PowerShell/terminal</li>
                    </ol>
                  </div>

                  <a href="http://localhost:5173" style="display: inline-flex; align-items: center; gap: 8px; background: #10b981; color: #022c22; font-weight: 800; text-decoration: none; padding: 14px 32px; border-radius: 14px; font-size: 15px; box-shadow: 0 10px 20px -5px rgba(16,185,129,0.4); cursor: pointer;">
                    <span>Open http://localhost:5173</span>
                    <span>➔</span>
                  </a>
                </div>
              </div>
            `;
          }
        });
      }
    </script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
